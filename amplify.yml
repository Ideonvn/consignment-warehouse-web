# Amplify Hosting build for the bidder web app.
#
# The same gate that runs locally runs here, in the same order: types, lint, build. Each
# command's exit status fails the build — Amplify stops the phase on the first non-zero
# exit — so a type error or a lint error cannot reach production just because the bundle
# happened to compile. That is the whole point of running them here rather than trusting
# that someone ran them before pushing.
#
# `npm ci` rather than `npm install`: the lockfile is the build's input, and `install`
# would be free to resolve a newer transitive dependency than the one that was tested.
version: 1
frontend:
  phases:
    preBuild:
      commands:
        # Fail before building rather than after shipping.
        #
        # These two are read at build time and inlined into the client bundle, and
        # `lib/api/client.ts` and `lib/realtime/socket.ts` fall back to localhost:8000
        # when they are unset — which is right for `npm run dev` without a .env.local,
        # and catastrophic here. A build that lost its branch environment would produce a
        # production bundle pointed at whatever machine happens to be running the
        # browser, failing as a network error on every screen: indistinguishable, to the
        # user and to support, from the API being down.
        #
        # Emptiness is the test, not definedness: an Amplify variable set to "" is
        # defined, and `${VAR:-}` would happily pass it straight through to the bundle.
        - |
          for required in NEXT_PUBLIC_API_BASE_URL NEXT_PUBLIC_WS_URL; do
            eval "value=\${$required:-}"
            if [ -z "$value" ]; then
              echo "BUILD FAILED: $required is unset or empty." >&2
              echo "Set it on the Amplify app or branch (Hosting > Environment variables), then redeploy." >&2
              echo "Without it this build would inline a localhost fallback and every API call would fail in production." >&2
              exit 1
            fi
            echo "ok: $required is set"
          done
        - npm ci --cache .npm --prefer-offline
    build:
      commands:
        - npx tsc --noEmit
        - npm run lint
        - npm run build
  artifacts:
    # `.next` for a WEB_COMPUTE app: Amplify reads the standalone server output from here
    # and runs the server-rendered routes itself.
    baseDirectory: .next
    files:
      - "**/*"
  cache:
    paths:
      - .next/cache/**/*
      - .npm/**/*
